f your year. Order deep and you could have your best quarter ever, or a warehouse of unsold stock in January.",options:[{label:"Order deep",hint:e=>`Costs ${E(e,25e3)} now. A good season brings it back and more.`,apply:(e,t)=>(m(e,{cash:-25e3}),t.chance(.55)?(m(e,{cash:45e3,brand:3}),"You ordered deep for the holidays, and it sold through."):(m(e,{cash:12e3}),"You ordered deep for the holidays. Much of it is still on the shelves."))},{label:"Order as usual",hint:()=>"No risk. If demand surges, you will run out.",apply:e=>(m(e,{cash:8e3}),"You ordered a normal amount for the season.")}]},{id:"shop_shrink",area:"Money",minStage:0,kinds:["shop"],when:te,title:()=>"Stock is going missing",body:()=>"The counts do not add up. Somewhere between shoplifting, staff and supplier errors, about 3% of your stock is disappearing.",options:[{label:"Cameras and tags",hint:e=>`Costs ${E(e,8e3)}. Losses fall. Some customers find it unwelcoming.`,apply:e=>(m(e,{cash:-8e3,brand:-1}),"You installed cameras and security tags.")},{label:"Audit the staff and suppliers",hint:()=>"Free, but the team feels watched.",apply:(e,t)=>(m(e,{morale:-5}),t.chance(.5)&&m(e,{cash:6e3}),"You audited staff and supplier deliveries.")},{label:"Accept it as a cost of business",hint:e=>`About ${E(e,6e3)} a quarter keeps walking out of the door.`,apply:e=>(m(e,{cash:-6e3}),"You wrote the losses off.")}]},{id:"shop_marketplace",area:"Customers",minStage:0,kinds:["shop"],when:te,title:()=>"Sell on the big online marketplace?",body:()=>"Listing on the giant online marketplace would put your products in front of millions. They take a cut, and their data shows them what sells, so they can copy it.",options:[{label:"List everything",hint:()=>"A jump in customers. Your brand becomes one listing among thousands.",apply:e=>{const t=-W(e,-.15);return m(e,{brand:-4,cash:-6e3}),`You listed on the marketplace and won ${t} ${he(e)}.`}},{label:"List only your basics",hint:()=>"Some extra sales; your best products stay exclusive to you.",apply:e=>`You listed a few basics and won ${-W(e,-.06)} ${he(e)}.`},{label:"Stay direct",hint:()=>"You keep control and the margin. Growth is slower.",apply:e=>(m(e,{brand:2}),"You kept selling only through your own channels.")}]},{id:"shop_supplier_exclusive",area:"Product",minStage:0,kinds:["shop"],when:_t,title:()=>"A supplier offers you an exclusive",body:()=>"Your best supplier will make a range only for you, if you stop stocking two of their competitors.",options:[{label:"Take the exclusive",hint:()=>"Something nobody else has. You depend on one supplier.",apply:e=>(m(e,{quality:5,brand:4}),H(e,"tariff_hit",9),"You signed an exclusive range with your best supplier.")},{label:"Keep your options open",hint:()=>"No dependence. No exclusive.",apply:()=>"You kept buying from several suppliers."}]},{id:"svc_scope_creep",area:"Customers",minStage:0,kinds:["svc"],when:te,title:()=>"A client keeps asking for more",body:()=>'A good client keeps adding "small" requests that were never in the agreement. Together they are now a week of work a month.',options:[{label:"Charge for the extras",hint:()=>"You are paid for your work. They may take it badly.",apply:(e,t)=>(m(e,{cash:8e3}),t.chance(.3)&&W(e,.03),"You started billing for the extra requests.")},{label:"Do it as goodwill",hint:()=>"The client is delighted. Your team is stretched.",apply:e=>(m(e,{brand:3,morale:-4,debt:4}),"You did the extra work for free.")}]},{id:"svc_fixed_fee",area:"Money",minStage:0,kinds:["svc"],when:te,title:()=>"A big prospect wants a fixed fee",body:()=>"A large prospect will only sign on a fixed price for the whole project. If it runs over, you eat the cost.",options:[{label:"Agree to the fixed fee",hint:()=>"You win the work. Whether you make money on it depends on your estimate.",apply:(e,t)=>{const n=-W(e,-.05);return t.chance(.45)?(m(e,{cash:-15e3,morale:-3}),`You won the fixed-fee project and ${n} ${he(e)}. It ran over budget.`):(m(e,{cash:1e4}),`You won the fixed-fee project and ${n} ${he(e)}, and came in under budget.`)}},{label:"Insist on time and materials",hint:()=>"No risk of overruns. They may go elsewhere.",apply:()=>"You held out for time-and-materials billing."}]},{id:"svc_partner_leaving",area:"People",minStage:1,kinds:["svc"],title:()=>"Your best senior wants to be a partner",body:()=>"Your strongest senior has the client relationships and knows it. They want to become a partner, with a share of the firm, or they will set up on their own.",options:[{label:"Make them a partner",hint:()=>"You give up a slice of the firm. They and their clients stay.",apply:e=>(e.company.split=Math.max(.3,e.company.split-.05),m(e,{morale:5,quality:2}),"You made your senior a partner in the firm.")},{label:"Offer a bonus, not equity",hint:e=>`Costs ${E(e,2e4)}. They may take the money and leave anyway.`,apply:(e,t)=>(m(e,{cash:-2e4}),t.chance(.45)&&H(e,"clients_follow",3),"You offered a large bonus instead of a partnership.")},{label:"Let them go",hint:()=>"No cost and no dilution. Some clients will follow them.",apply:e=>(qt(e,"engineers"),H(e,"clients_follow",2),"Your senior left to start their own firm.")}]},{id:"svc_ai",area:"Product",minStage:0,kinds:["svc","media"],when:_t,title:()=>"AI tools can do the junior work",body:()=>"New AI tools can do much of what your junior staff spend their days on. Clients are starting to ask why they should pay full rates for it.",options:[{label:"Adopt them and cut prices",hint:()=>"You win price-sensitive clients and do more with the same people. Margins per job fall.",apply:e=>{const t=-W(e,-.08);return e.company.price*=.92,m(e,{quality:3}),`You adopted AI tools and cut your rates. ${t} new ${he(e)} signed up.`}},{label:"Adopt them, keep prices",hint:()=>"Higher margins for now. Clients who notice will push back.",apply:e=>(m(e,{cash:1e4,brand:-3}),"You adopted AI tools and kept your rates.")},{label:"Sell your work as human-made",hint:()=>"A premium position for clients who care. Fewer of them every year.",apply:e=>(m(e,{brand:4}),W(e,.04),"You positioned your work as human-made.")}]},{id:"care_insurer_cut",area:"Money",minStage:0,kinds:["care"],when:te,title:()=>"An insurer cut what it pays you",body:()=>"The biggest insurer you work with cut its rate for your most common service by 15%.",options:[{label:"Drop that insurer",hint:e=>`Patients on that plan will leave: about 10% of ${he(e)}.`,apply:e=>{const t=W(e,.1);return m(e,{morale:2}),`You dropped the insurer. ${t} ${he(e)} left with it.`}},{label:"Accept the cut",hint:e=>`About ${E(e,9e3)} less revenue a quarter.`,apply:e=>(m(e,{cash:-9e3}),"You accepted the lower rate.")},{label:"Negotiate as a group",hint:e=>`Costs ${E(e,4e3)} to join a practice network. It might work.`,apply:(e,t)=>(m(e,{cash:-4e3}),t.chance(.5)?"You joined a network and won back most of the rate.":(m(e,{cash:-6e3}),"You joined a network. The insurer did not budge."))}]},{id:"care_no_shows",area:"Customers",minStage:0,kinds:["care"],when:te,title:()=>"No-shows are costing you",body:()=>"One booking in eight is a no-show. Each empty slot is a practitioner you are paying to wait.",options:[{label:"Charge a no-show fee",hint:()=>"Fewer empty slots. Some regulars will be offended.",apply:e=>(m(e,{cash:6e3,brand:-3}),W(e,.02),"You introduced a no-show fee.")},{label:"Reminders and a waiting list",hint:e=>`Costs ${E(e,2500)} for software. Fills most of the gaps politely.`,apply:e=>(m(e,{cash:-2500,quality:2}),"You set up reminders and a waiting list.")},{label:"Overbook a little",hint:()=>"Free. On the days everyone turns up, the waiting room will boil over.",apply:e=>(m(e,{cash:4e3,debt:6}),"You started overbooking slots.")}]},{id:"care_star",area:"People",minStage:1,kinds:["care"],title:()=>"Your busiest practitioner wants a bigger cut",body:e=>`Your most booked practitioner brings in a fifth of your ${he(e)}. They want to move from salary to a 50% share of what they bill.`,options:[{label:"Agree to the split",hint:e=>`Costs about ${E(e,1e4)} a quarter. They stay, and others will ask.`,apply:e=>(m(e,{cash:-1e4,morale:2}),"You moved your star practitioner to a revenue share.")},{label:"Say no",hint:()=>"No extra cost. They may leave, and their regulars may follow.",apply:(e,t)=>{if(t.chance(.5)){const n=W(e,.1);return qt(e,"engineers"),`Your star practitioner left. ${n} ${he(e)} followed.`}return m(e,{morale:-3}),"You said no. They stayed, for now."}}]},{id:"care_hours",area:"Customers",minStage:0,kinds:["care"],when:te,title:()=>"Open evenings and weekends?",body:()=>"People keep asking for appointments outside office hours. Staffing them means overtime or new hires.",options:[{label:"Extend the hours",hint:e=>`Costs ${E(e,12e3)} a quarter in staffing. More ${he(e)} can fit you in.`,apply:e=>(m(e,{cash:-12e3,morale:-2}),`You opened evenings and weekends and gained ${-W(e,-.08)} ${he(e)}.`)},{label:"Keep the hours",hint:()=>"No cost. Some people will go where they can be seen after work.",apply:()=>"You kept your opening hours."}]},{id:"trade_injury",area:"Ethics",minStage:1,kinds:["trade"],title:()=>"A worker got hurt on a job",body:()=>"One of your crew fell from a ladder on site. It is not serious, but he will be off for six weeks.",options:[{label:"Report it and pay in full",hint:e=>`Costs ${E(e,9e3)} and a premium rise. The crew sees you look after them.`,apply:e=>(m(e,{cash:-9e3,morale:5}),"You reported the injury and paid his wages in full.")},{label:"Settle it quietly",hint:e=>`Costs ${E(e,3e3)} now. If it comes out, it will cost far more.`,apply:e=>(m(e,{cash:-3e3,morale:-3}),H(e,"injury_claim",5),"You settled the injury privately.")}]},{id:"trade_fixed_price",area:"Money",minStage:0,kinds:["trade"],when:te,title:()=>"Materials jumped mid-job",body:()=>"You quoted a big job at a fixed price. Lumber and copper have since gone up by a quarter.",options:[{label:"Honour the quote",hint:e=>`Costs about ${E(e,9e3)}. The customer will tell everyone how you behaved.`,apply:e=>(m(e,{cash:-9e3,brand:4}),"You honoured the quote and took the hit.")},{label:"Ask them to share the rise",hint:()=>"Most will agree. Some will not, and they write reviews.",apply:(e,t)=>t.chance(.6)?(m(e,{cash:-3e3}),"The customer agreed to split the extra cost."):(m(e,{cash:-9e3,brand:-4}),"The customer refused and left a scathing review.")}]},{id:"trade_builder_contract",area:"Customers",minStage:0,kinds:["trade"],when:te,title:()=>"A big builder offers steady work",body:()=>"A regional builder wants you on all its new homes for a year. The volume is huge; the rate is low, and they pay ninety days after the work is done.",options:[{label:"Sign the contract",hint:e=>`A full calendar, ${E(e,2e4)} tied up waiting to be paid, and less time for better-paying work.`,apply:e=>{const t=-W(e,-.15);return m(e,{cash:-2e4,debt:5}),H(e,"anchor_leaves",12),`You signed with the builder: ${t} more ${he(e)}' worth of work, paid slowly.`}},{label:"Stay with private customers",hint:()=>"Better margins and faster payment. Quieter months.",apply:e=>(m(e,{brand:2}),"You stayed with private customers.")}]},{id:"trade_lowballer",area:"Customers",minStage:0,kinds:["trade"],when:te,title:()=>"An unlicensed crew is undercutting you",body:()=>"A crew with no licence or insurance is quoting 40% below you on every job in town.",options:[{label:"Match their prices",hint:()=>"You keep the volume. You do the same work for much less.",apply:e=>(e.company.price*=.9,m(e,{morale:-2}),"You cut prices to compete with the unlicensed crew.")},{label:"Sell what they cannot",hint:e=>`Costs ${E(e,4e3)} in marketing your licence, insurance and warranty.`,apply:e=>(m(e,{cash:-4e3,brand:5}),"You marketed your licence, insurance and warranty.")},{label:"Report them",hint:()=>"Free. It might work, and it might make you enemies.",apply:(e,t)=>t.chance(.5)?"The licensing board shut the crew down.":(m(e,{brand:-2}),"The report went nowhere, and word got around that you made it.")}]},{id:"trade_winter",area:"Money",minStage:1,kinds:["trade"],title:()=>"The slow season is coming",body:()=>"Work dries up for three months every winter. Your crew still needs paying.",options:[{label:"Keep everyone on",hint:e=>`Costs about ${E(e,15e3)} in idle wages. Your crew is still yours in spring.`,apply:e=>(m(e,{cash:-15e3,morale:6}),"You kept the whole crew on through the slow season.")},{label:"Take low-margin indoor work",hint:()=>"Covers the wages, barely. Everyone is tired by spring.",apply:e=>(m(e,{cash:-4e3,morale:-3}),"You filled the season with low-margin indoor jobs.")},{label:"Lay off for the season",hint:()=>"Saves the wages. Some will not come back.",apply:e=>(qt(e,Kn(e)),m(e,{morale:-6}),"You laid people off for the winter.")}]},{id:"sw_security_audit",area:"Customers",minStage:0,kinds:["sw"],when:te,title:()=>"A big prospect wants a security audit",body:()=>"A large company wants to buy, but only if you pass a formal security audit. It takes months of work and outside auditors.",options:[{label:"Do the audit",hint:e=>`Costs ${E(e,4e4)}. Opens the door to every larger buyer.`,apply:e=>(m(e,{cash:-4e4,quality:4,brand:5}),`You passed the security audit and signed the prospect along with ${-W(e,-.05)} more ${he(e)}.`)},{label:"Fill in their questionnaire as best you can",hint:()=>"Free. Some answers will be optimistic.",apply:e=>(H(e,"breach_found",8),"You answered the security questionnaire and hoped for the best.")},{label:"Stay with smaller customers",hint:()=>"No audit. The biggest deals are out of reach.",apply:()=>"You passed on the large prospect."}]},{id:"sw_whale",area:"Product",minStage:0,kinds:["sw","mkt"],when:te,title:()=>"Your biggest customer wants a custom feature",body:()=>"Your largest customer will triple their contract if you build a feature only they need. It would take your whole team a quarter.",options:[{label:"Build it for them",hint:e=>`+${E(e,4e4)} a year from them. Everything else waits, and ${pe(e).debt.toLowerCase()} piles up.`,apply:e=>(m(e,{cash:3e4,debt:12,quality:-2}),"You built the custom feature for your biggest customer.")},{label:"Build a general version",hint:()=>"Slower, useful to everyone. They may not wait.",apply:(e,t)=>(m(e,{quality:4}),t.chance(.35)&&W(e,.03),"You built a general version of the feature.")},{label:"Say no",hint:()=>"The roadmap stays yours. They may look elsewhere.",apply:e=>(W(e,.03),"You declined the custom feature.")}]},{id:"sw_open_source",area:"Customers",minStage:0,kinds:["sw"],when:te,title:()=>"A free open-source rival appeared",body:()=>"A free, open-source tool does about 70% of what you do. Smaller customers are trying it.",options:[{label:"Launch a free tier",hint:()=>"You keep small users in your world. Some paying users will downgrade.",apply:e=>(m(e,{brand:6,cash:-1e4}),"You launched a free tier.")},{label:"Move upmarket",hint:()=>"Focus on what bigger customers need. Small ones will drift away.",apply:e=>(W(e,.06),e.company.price*=1.1,m(e,{quality:3}),"You moved upmarket and raised prices.")}]},{id:"sw_rewrite",area:"Product",minStage:1,kinds:["sw","app","mkt"],when:e=>e.company.techDebt>30,title:()=>"The engineers want to rewrite it",body:()=>"Your engineers say the code is too tangled to keep building on. They want two quarters to rewrite the core.",options:[{label:"Approve the rewrite",hint:e=>`${pe(e).debt} falls a long way. No new features for two quarters.`,apply:e=>(m(e,{debt:-30,quality:-3,morale:5}),"You approved a rewrite of the core.")},{label:"Refactor piece by piece",hint:()=>"Slower, safer. Some features still ship.",apply:e=>(m(e,{debt:-12}),"You chose to clean up the code piece by piece.")},{label:"Keep shipping features",hint:()=>"Customers see progress. The engineers are frustrated, and the mess grows.",apply:e=>(m(e,{quality:3,debt:6,morale:-5}),"You kept shipping features on the old code.")}]},{id:"app_store_fees",area:"Money",minStage:0,kinds:["app"],when:te,title:()=>"The app stores take 30%",body:()=>"The app stores take up to 30% of every subscription. You could push people to pay on your website instead, where the stores cannot touch it.",options:[{label:"Push web payments",hint:()=>"Better margins. Fewer people complete sign-up outside the app.",apply:e=>(m(e,{cash:1e4}),W(e,.04),"You started steering subscribers to pay on the web.")},{label:"Keep in-app payments",hint:()=>"Smooth sign-up. The stores keep their cut.",apply:()=>"You kept in-app payments."}]},{id:"app_cancel_flow",area:"Ethics",minStage:0,kinds:["app","media"],when:te,title:()=>"Make cancelling harder?",body:()=>'Your growth lead shows that hiding the cancel button and adding three "are you sure" screens would cut cancellations by a quarter.',options:[{label:"Do it",hint:()=>"Fewer cancellations now. Regulators and reviewers notice these things.",apply:e=>(m(e,{brand:-5,cash:8e3}),H(e,"compliance_fine",6),"You made cancelling harder.")},{label:"Offer a pause instead",hint:()=>"Some who would cancel pause instead, and come back later.",apply:e=>(m(e,{brand:2,cash:3e3}),'You added a "pause" option to the cancel flow.')},{label:"Keep it one click",hint:()=>"Honest and simple. Churn stays where it is.",apply:e=>(m(e,{brand:3}),"You kept cancelling to one click.")}]},{id:"app_viral",area:"Product",minStage:0,kinds:["app","mkt"],when:te,title:()=>"You went viral overnight",body:()=>"A video about your app took off. Sign-ups are up tenfold and the servers are struggling.",options:[{label:"Pay for emergency capacity",hint:e=>`Costs ${E(e,2e4)}. Everyone who arrives has a good first experience.`,apply:e=>(m(e,{cash:-2e4,brand:8}),`You scaled up overnight and kept ${-W(e,-.2)} of the new arrivals.`)},{label:"Add a waiting list",hint:()=>"Free, and scarcity can help. Many will not wait.",apply:e=>(m(e,{brand:5}),`You put new users on a waiting list and kept ${-W(e,-.08)} of them.`)}]},{id:"app_privacy",area:"Ethics",minStage:0,kinds:["app","mkt","media"],when:_t,title:()=>"An ad network wants your users’ data",body:()=>"An advertising network will pay well to put its tracking code in your app.",options:[{label:"Take the money",hint:e=>`+${E(e,25e3)}. If users or regulators find out, they will not like it.`,apply:e=>(m(e,{cash:25e3}),H(e,"compliance_fine",8),"You added the ad network’s tracking.")},{label:"Say no and say so",hint:()=>"No money. A privacy promise you can market.",apply:e=>(m(e,{brand:4}),"You refused the tracking deal and made privacy a selling point.")}]},{id:"mkt_subsidy",area:"Money",minStage:0,kinds:["mkt"],when:_t,title:()=>"Subsidise one side to grow the other?",body:()=>"Buyers come for sellers and sellers come for buyers. You could pay sellers to join for a quarter to break the deadlock.",options:[{label:"Pay sellers to join",hint:e=>`Costs ${E(e,3e4)}. More choice brings more buyers; the habit of being paid is hard to break.`,apply:e=>(m(e,{cash:-3e4,quality:6,brand:3}),"You paid sellers to join the platform.")},{label:"Grow both sides slowly",hint:()=>"No cost. A rival with deeper pockets may get there first.",apply:()=>"You let both sides of the market grow on their own."}]},{id:"mkt_fraud",area:"Customers",minStage:0,kinds:["mkt"],when:te,title:()=>"Scammers have found your platform",body:()=>"Fake listings are appearing and a few buyers have lost money. So far it is small.",options:[{label:"Build a trust team now",hint:e=>`Costs ${E(e,2e4)}. Verification slows sign-ups a little.`,apply:e=>(m(e,{cash:-2e4,brand:4,quality:2}),"You built a trust and safety team.")},{label:"Refund victims case by case",hint:()=>"Cheap for now. If it grows, it grows fast.",apply:e=>(m(e,{cash:-3e3}),H(e,"fraud_wave",4),"You refunded the victims and left the doors open.")}]},{id:"mkt_take_rate",area:"Money",minStage:0,kinds:["mkt"],when:te,title:()=>"Raise your commission?",body:()=>"You take 10% of every transaction. Investors say the market leader takes 20%, and you could too.",options:[{label:"Raise it to 15%",hint:()=>"More revenue per transaction. Some sellers will go elsewhere.",apply:e=>(e.company.price*=1.12,W(e,.05),"You raised your commission.")},{label:"Keep it low and grow",hint:()=>"Cheaper than rivals. Growth over margin.",apply:e=>(m(e,{brand:3}),"You kept your commission low.")}]},{id:"mfg_defect",area:"Ethics",minStage:0,kinds:["mfg"],when:te,title:()=>"A batch may be faulty",body:()=>"Testing found that one batch has a part that may fail after a year. Most of it has already shipped.",options:[{label:"Recall it now",hint:e=>`Costs ${E(e,35e3)}. Customers trust you more for it.`,apply:e=>(m(e,{cash:-35e3,brand:3}),"You recalled the faulty batch.")},{label:"Fix units as they fail",hint:()=>"Cheaper unless the failures come all at once.",apply:e=>(H(e,"recall",8),"You chose to replace units only when they fail.")}]},{id:"mfg_shortage",area:"Product",minStage:0,kinds:["mfg"],when:te,title:()=>"A key component is on allocation",body:()=>"The chip in your product is on allocation worldwide. Brokers have it at three times the price.",options:[{label:"Pay the broker",hint:e=>`Costs ${E(e,25e3)}. Production keeps running.`,apply:e=>(m(e,{cash:-25e3}),"You bought chips from a broker at a premium.")},{label:"Redesign around another part",hint:()=>"Takes your engineers a quarter. No dependence on that chip again.",apply:e=>(m(e,{quality:-3,debt:-5}),W(e,.04),"You redesigned the product around a different part.")},{label:"Pause production",hint:()=>"Free. Customers will wait, or buy elsewhere.",apply:e=>`You paused production. ${W(e,.08)} ${he(e)} went elsewhere.`}]},{id:"mfg_retailer",area:"Customers",minStage:0,kinds:["mfg","shop"],when:te,title:()=>"A national retailer wants your product",body:()=>"A national chain will stock you in every store. Their terms: payment in 90 days, fines for late deliveries, and the right to return what does not sell.",options:[{label:"Take the deal",hint:e=>`Big volume and visibility. ${E(e,3e4)} of stock sits on their shelves waiting to be paid for.`,apply:e=>{const t=-W(e,-.2);return m(e,{cash:-3e4,brand:6}),`You signed with the national chain and reached ${t} more ${he(e)}.`}},{label:"Stay with independents and direct",hint:()=>"Smaller, steadier, paid on time.",apply:e=>(m(e,{cash:5e3}),"You turned down the national chain.")}]},{id:"deep_results",area:"Ethics",minStage:0,kinds:["deep"],when:e=>_t(e)&&!e.company.launched,title:()=>"The results are ambiguous",body:()=>"Your latest study shows an effect, but it falls just short of the threshold you promised investors. The data could be presented more kindly.",options:[{label:"Report it straight",hint:()=>"Investors are disappointed. You keep your credibility, and the science stays honest.",apply:e=>(m(e,{morale:-3,brand:2}),"You reported the results exactly as they came out.")},{label:"Run a bigger study",hint:e=>`Costs ${E(e,6e4)}. If the effect is real, a bigger study will show it.`,apply:(e,t)=>(m(e,{cash:-6e4}),t.chance(.55)?(m(e,{quality:6}),"The bigger study confirmed the effect."):(m(e,{quality:-3}),"The bigger study did not confirm the effect."))},{label:"Present it favourably",hint:()=>"Investors stay happy. If it is found out, the damage is severe.",apply:e=>(m(e,{brand:2}),H(e,"numbers_exposed",8),"You presented the results in their best light.")}]},{id:"deep_partner",area:"Money",minStage:0,kinds:["deep"],when:_t,title:()=>"A giant offers a partnership",body:()=>"One of the industry giants offers cash and expertise to co-develop your lead programme. In return they get the rights in most of the world.",options:[{label:"Sign the partnership",hint:e=>`+${E(e,3e5)} and their expertise. Most of the upside goes to them.`,apply:e=>(m(e,{cash:3e5,quality:5}),e.company.founderEquity*=.85,"You signed a partnership with the industry giant.")},{label:"Go it alone",hint:()=>"You keep everything, including all the risk.",apply:e=>(m(e,{morale:3}),"You turned down the partnership.")}]},{id:"deep_regulator",area:"Product",minStage:0,kinds:["deep"],when:e=>_t(e)&&!e.company.launched,title:()=>"The regulator asks for more",body:()=>"At a pre-submission meeting the regulator hinted it may want more safety data than you planned to collect.",options:[{label:"Collect it now",hint:e=>`Costs ${E(e,8e4)}. No surprises at submission.`,apply:e=>(m(e,{cash:-8e4,quality:3}),"You started collecting the extra safety data.")},{label:"Submit with what you have",hint:()=>"Faster and cheaper if they accept it. If not, months of work redone.",apply:e=>(H(e,"regulator_hold",6),"You decided to submit with the data you had.")}]},{id:"deep_pivot",area:"Product",minStage:0,kinds:["deep"],when:e=>_t(e)&&!e.company.launched&&bo(e)>=9,title:()=>"A smaller market would get you there sooner",body:()=>"Your scientists think the technology would win approval much sooner for a narrower use. The market would be a fraction of the size.",options:[{label:"Pivot to the narrow use",hint:()=>"A shorter road to revenue. A smaller prize at the end of it.",apply:e=>(m(e,{quality:10}),e.market.tam=Math.round(e.market.tam*.6),"You pivoted to the narrower, faster use.")},{label:"Stay the course",hint:()=>"The big prize, if the money lasts.",apply:()=>"You stayed on the original course."}]},{id:"media_sponsor",area:"Ethics",minStage:0,kinds:["media"],when:te,title:()=>"A sponsor wants a say",body:()=>"Your biggest sponsor offers to double its spending, on condition that you run its talking points past it before publishing anything about its industry.",options:[{label:"Take the money",hint:e=>`+${E(e,3e4)}. Your audience may notice what you stop saying.`,apply:e=>(m(e,{cash:3e4,brand:-6}),"You accepted the sponsor’s conditions.")},{label:"Keep editorial control",hint:()=>"The sponsor walks. Your audience trusts you more.",apply:e=>(m(e,{cash:-8e3,brand:5}),"You kept editorial control and lost the sponsor.")}]},{id:"media_algorithm",area:"Customers",minStage:0,kinds:["media","app"],when:te,title:()=>"The algorithm changed",body:()=>"The platform where most people find you changed how it ranks content. Your reach dropped by half overnight.",options:[{label:"Chase the new format",hint:()=>"Reach recovers. The work changes, and not everyone likes it.",apply:e=>(m(e,{brand:4,quality:-3,morale:-3}),"You reshaped your content for the new algorithm.")},{label:"Build your own list",hint:e=>`Costs ${E(e,8e3)}. Slower, but nobody can switch it off.`,apply:e=>(m(e,{cash:-8e3,quality:2}),W(e,.04),"You invested in your own mailing list and community.")}]},{id:"media_star",area:"People",minStage:1,kinds:["media"],title:()=>"Your star creator wants equity",body:e=>`Your best-known creator draws a large share of your ${he(e)}. A rival has offered them a stake.`,options:[{label:"Give them equity",hint:()=>"You give up a slice of the company. They and their fans stay.",apply:e=>(e.company.founderEquity*=.95,m(e,{morale:3}),"You gave your star creator a stake in the company.")},{label:"Build the brand beyond them",hint:e=>`Costs ${E(e,15e3)} to develop new voices. They may leave anyway.`,apply:(e,t)=>(m(e,{cash:-15e3,quality:2}),t.chance(.5)&&H(e,"creator_exodus",3),"You started developing new creators.")}]},{id:"media_copyright",area:"Ethics",minStage:0,kinds:["media"],when:te,title:()=>"A copyright claim",body:()=>"A rights holder says a popular piece of yours uses their material without permission. Your lawyer thinks it is fair use. Probably.",options:[{label:"Settle and take it down",hint:e=>`Costs ${E(e,7e3)}. Over quickly.`,apply:e=>(m(e,{cash:-7e3,brand:-1}),"You settled the copyright claim.")},{label:"Fight it",hint:e=>`Costs ${E(e,12e3)} in legal fees. A win sets a useful precedent; a loss costs far more.`,apply:(e,t)=>(m(e,{cash:-12e3}),t.chance(.55)?(m(e,{brand:4}),"You fought the claim and won."):(m(e,{cash:-25e3}),"You fought the claim and lost."))}]}],si={...Yy,bad_review:(e,t)=>{if(!t.chance(.45))return null;const n=W(e,.05);return m(e,{brand:-6}),`The customer you refused to make whole went public. The story spread and ${n} ${pe(e).unit} left.`},burnout:(e,t)=>t.chance(.45)?(m(e,{quality:-5,morale:-8}),"You hit a wall. Weeks of exhaustion left the work unattended and the team rattled."):null,compliance_fine:(e,t)=>t.chance(.4)?(m(e,{cash:-4e4,brand:-5}),`The cheap compliance patch did not hold up. An inspection ended in a ${E(e,4e4)} penalty.`):null,late_invoice:(e,t)=>t.chance(.5)?(m(e,{cash:3e4}),`Your patience paid off: the late customer settled their ${E(e,3e4)} invoice in full.`):"The customer you gave time to never paid. The invoice is written off.",jerk_fallout:(e,t)=>{if(!t.chance(.55))return null;const n=qt(e,Kn(e));return m(e,{morale:-8}),n?"A good employee quit, naming the colleague you chose to keep as the reason. Others are watching.":"Resentment over the colleague you chose to keep is spreading through the team."},raise_ripple:(e,t)=>t.chance(.5)?(m(e,{cash:-25e3}),`Word of the raise got around. Matching it for others cost another ${E(e,25e3)}.`):null,pay_claim:(e,t)=>t.chance(.5)?(m(e,{cash:-6e4,brand:-5,morale:-6}),`The pay gap you left alone became a legal claim. Settling it cost ${E(e,6e4)} and made the news.`):null,settlement_leak:(e,t)=>t.chance(.5)?(m(e,{brand:-10,morale:-10}),"The quiet settlement leaked. Staff and customers now know what was covered up."):null,incident_leak:(e,t)=>{if(!t.chance(.5))return null;const n=W(e,.1);return m(e,{brand:-15,cash:-5e4}),`The incident you kept quiet came out anyway. ${n} ${pe(e).unit} left and regulators fined you ${E(e,5e4)}.`},insider_struggles:(e,t)=>t.chance(.4)?(m(e,{debt:8,morale:-3}),"The loyal employee you promoted is out of their depth. Problems are piling up under them."):null,discount_spreads:(e,t)=>t.chance(.5)?(m(e,{cash:-15e3}),`Other ${pe(e).unit} heard about the special discount and demanded the same. It cost ${E(e,15e3)}.`):null,numbers_exposed:(e,t)=>t.chance(.6)?(m(e,{brand:-12,morale:-10,cash:-8e4}),`The massaged numbers were found out. Restating them cost ${E(e,8e4)} and a great deal of trust.`):null},lu=[{id:"discount_demand",area:"Customers",minStage:0,when:te,title:()=>"Your biggest customer wants a discount",body:e=>`One of your largest ${pe(e).unit} says a rival offered them 30% less. They want you to match it or they leave, and they are the kind who tell others.`,options:[{label:"Match the price",hint:e=>`Costs about ${E(e,12e3)} in lost revenue. They stay, but others may hear and ask for the same.`,apply:e=>(m(e,{cash:-12e3}),H(e,"discount_spreads",3),"You matched the rival price to keep your biggest customer.")},{label:"Hold your price",hint:e=>`You lose them and a few who follow, about 4% of ${pe(e).unit}. Your pricing stays intact.`,apply:e=>{const t=W(e,.04);return m(e,{morale:2}),`You held your price. ${t} ${pe(e).unit} left, the big one among them.`}},{label:"Offer more service instead",hint:()=>"They stay at full price, but the extra work stretches the team and standards slip.",apply:e=>(m(e,{debt:6,morale:-3}),"You kept the customer at full price by promising extra service.")}]},{id:"botched_job",area:"Customers",minStage:0,when:te,title:()=>"You got one badly wrong",body:()=>"A customer is furious about a serious mistake that was plainly your fault. They want a full refund and compensation for their trouble.",options:[{label:"Refund and compensate",hint:e=>`Costs ${E(e,9e3)}. Turns an angry customer into a story about how you handle mistakes.`,apply:e=>(m(e,{cash:-9e3,brand:3}),"You refunded the customer in full and paid for their trouble.")},{label:"Refund only what the contract requires",hint:e=>`Costs ${E(e,3e3)}. Legally fine. They may take the story public.`,apply:e=>(m(e,{cash:-3e3,brand:-2}),H(e,"bad_review",3),"You refunded the contractual minimum and no more.")}]},{id:"founder_pay",area:"You",minStage:0,when:e=>bo(e)>=6,title:()=>"You cannot live on what you pay yourself",body:()=>"Your savings are nearly gone. At home the question is how much longer this can go on at a salary well below what you used to earn.",options:[{label:"Pay yourself properly",hint:e=>`Costs the company ${E(e,15e3)} this quarter. You can think clearly again.`,apply:e=>(m(e,{cash:-15e3,morale:4}),"You raised your own pay to something you can live on.")},{label:"Keep it lean",hint:()=>"Costs nothing now. The strain builds, and people who run on empty tend to break.",apply:e=>(m(e,{morale:-3}),H(e,"burnout",3),"You kept your pay minimal and carried on.")}]},{id:"ship_or_fix",area:"Product",minStage:0,when:te,title:e=>`Launch the new ${pe(e).offering.toLowerCase()} now, or get it right`,body:e=>"Customers were promised an improvement this quarter. It works, mostly, but you know of flaws that will cause trouble later. Getting it right means missing the date you promised.",options:[{label:"Launch on time",hint:e=>`You keep your word and win customers now. ${pe(e).debt} rises sharply.`,apply:e=>(m(e,{debt:10,brand:2,quality:2}),"You launched on the promised date, flaws and all.")},{label:"Delay and fix it",hint:e=>`A better result and less ${pe(e).debt.toLowerCase()}, but you break a promise and some customers lose patience.`,apply:e=>{const t=W(e,.02);return m(e,{quality:4,debt:-3,brand:-2}),`You delayed to get it right. ${t} impatient ${pe(e).unit} left.`}}]},{id:"supplier_rise",area:"Money",minStage:0,title:()=>"A key supplier raises prices 15%",body:()=>"The supplier you depend on most is putting prices up by 15%, effective immediately. They know switching is painful for you.",options:[{label:"Absorb it",hint:e=>`Costs ${E(e,1e4)} this quarter and squeezes your margin. Customers notice nothing.`,apply:e=>(m(e,{cash:-1e4}),"You absorbed the supplier increase.")},{label:"Pass it on to customers",hint:e=>`Protects your margin. About 3% of ${pe(e).unit} will leave over the increase.`,apply:e=>`You passed the increase on. ${W(e,.03)} ${pe(e).unit} left over it.`},{label:"Switch to a cheaper supplier",hint:()=>"Saves the money. The cheaper option is worse, and the switch itself is disruptive.",apply:e=>(m(e,{quality:-4,debt:5}),"You switched to a cheaper supplier and accepted the drop in quality.")}]},{id:"late_payer",area:"Money",minStage:0,when:te,title:()=>"A customer owes you and is not paying",body:e=>`A long-standing customer is three months late on ${E(e,3e4)}. They say cash is tight and ask for more time. You need the money too.`,options:[{label:"Demand payment and stop work",hint:e=>`You recover ${E(e,2e4)} after legal costs. You lose the customer and a little goodwill.`,apply:e=>(m(e,{cash:2e4,brand:-1}),W(e,.01),"You forced the late payer to settle and stopped working for them.")},{label:"Give them time",hint:()=>"Nothing now. In a quarter you find out whether they pay in full or never pay at all.",apply:e=>(H(e,"late_invoice",3),"You gave the late payer another quarter.")},{label:"Settle for half now",hint:e=>`${E(e,15e3)} today, the rest forgiven. The relationship survives.`,apply:e=>(m(e,{cash:15e3}),"You took half the invoice now and forgave the rest.")}]},{id:"compliance_gap",area:"Ethics",minStage:0,title:()=>"You are not fully compliant",body:()=>"Your accountant has found that the business has been skipping a licensing and tax requirement. Nobody has noticed. Fixing it properly is expensive.",options:[{label:"Fix it properly",hint:e=>`Costs ${E(e,12e3)} now. The problem is gone for good.`,apply:e=>(m(e,{cash:-12e3}),"You paid to become fully compliant.")},{label:"Patch it cheaply",hint:e=>`Costs ${E(e,3e3)}. It probably holds. If it does not, the penalty is far larger.`,apply:e=>(m(e,{cash:-3e3}),H(e,"compliance_fine",6),"You patched the compliance gap as cheaply as possible.")}]},{id:"rival_attack",area:"Customers",minStage:0,title:e=>{var t;return`${((t=e.market.competitors[0])==null?void 0:t.name)??"A rival"} is running you down`},body:e=>{var t;return`${((t=e.market.competitors[0])==null?void 0:t.name)??"A rival"} is telling buyers you are unreliable. Some of it is exaggerated; a little of it is true.`},options:[{label:"Answer publicly",hint:()=>"Even odds: you win the argument and gain reputation, or you look defensive and lose some.",apply:(e,t)=>t.chance(.5)?(m(e,{brand:6}),"You answered the rival publicly and came out ahead."):(m(e,{brand:-5}),"You answered the rival publicly and looked defensive.")},{label:"Ignore it",hint:()=>"No drama. The claims go unanswered and some buyers believe them.",apply:e=>(m(e,{brand:-2}),"You ignored the rival and let the claims stand.")},{label:"Fix the part that is true",hint:e=>`Costs ${E(e,8e3)} and a quarter of distraction. Removes the grain of truth they are using.`,apply:e=>(m(e,{cash:-8e3,quality:3}),"You quietly fixed the weakness the rival was pointing at.")}]},{id:"time_off",area:"You",minStage:0,when:e=>bo(e)>=6,title:()=>"You have not had a day off in months",body:()=>"You are making small mistakes and snapping at people. A break would help, but there is nobody to hand things to and the quarter is not going to wait.",options:[{label:"Take two weeks off",hint:()=>"Work slips while you are away. You come back sharper and so does everyone around you.",apply:e=>(m(e,{quality:-2,morale:5}),"You took two weeks off. Some work slipped; you came back clear-headed.")},{label:"Push through",hint:()=>"Nothing slips this quarter. The risk of a real collapse grows.",apply:e=>(H(e,"burnout",3),"You pushed through without a break.")}]},{id:"cut_or_keep_quality",area:"Product",minStage:0,when:e=>bo(e)>=3&&e.company.cash<ou(e,12e4),title:()=>"Cash is tight. Cut a corner?",body:e=>`Money is running low. There is a cheaper way to deliver your ${pe(e).offering.toLowerCase()} that most customers would not notice straight away.`,options:[{label:"Cut the corner",hint:e=>`Saves ${E(e,14e3)} this quarter. Quality drops and ${pe(e).debt.toLowerCase()} builds.`,apply:e=>(m(e,{cash:14e3,quality:-4,debt:6}),"You cut a corner to save cash.")},{label:"Hold the standard",hint:()=>"No saving. The team sees what you are willing to protect when money is short.",apply:e=>(m(e,{morale:3}),"You held your standard even with cash tight.")}]},{id:"brilliant_jerk",area:"People",minStage:1,title:()=>"Your best performer is poisoning the team",body:()=>"One person produces more than anyone else and treats colleagues with contempt. Two people have now asked you, separately, how long you intend to put up with it.",options:[{label:"Let them go",hint:()=>"You lose your most productive person and output drops. The rest of the team breathes again.",apply:e=>(qt(e,Kn(e)),m(e,{quality:-4,morale:10}),"You let your best but most toxic performer go.")},{label:"Keep them",hint:()=>"Output holds. Morale drops, and the people who complained may be the ones to leave.",apply:e=>(m(e,{morale:-6}),H(e,"jerk_fallout",3),"You kept the toxic top performer.")},{label:"Pay for coaching",hint:e=>`Costs ${E(e,8e3)}. Works about half the time. If it fails you are back where you started, later.`,apply:(e,t)=>(m(e,{cash:-8e3}),t.chance(.5)?(m(e,{morale:4}),"Coaching worked. Your top performer is learning to work with people."):(H(e,"jerk_fallout",3),"You paid for coaching. So far nothing has changed."))}]},{id:"raise_request",area:"People",minStage:1,title:()=>"A key employee has an outside offer",body:()=>"Someone you rely on has an offer for 25% more. They would rather stay, they say, but they need you to match it this week.",options:[{label:"Match it",hint:e=>`Costs ${E(e,2e4)} a year. They stay. Pay is never as secret as you hope.`,apply:e=>(m(e,{cash:-2e4}),H(e,"raise_ripple",3),"You matched the outside offer.")},{label:"Wish them well",hint:()=>"You lose them and their knowledge. Nobody else gets the idea that threats work.",apply:e=>(qt(e,Kn(e)),m(e,{morale:-4,quality:-2}),"You declined to match the offer and they left.")},{label:"Offer ownership instead of cash",hint:()=>"No cash. You give up 2% of the company for good, and they stay.",apply:e=>(e.company.founderEquity*=.98,m(e,{morale:2}),"You kept your key employee with a 2% stake in the company.")}]},{id:"loyal_underperformer",area:"People",minStage:1,title:()=>"An early employee cannot keep up",body:()=>"They joined when nobody else would and worked nights to get you here. The job has outgrown them and everyone can see it.",options:[{label:"Let them go, generously",hint:e=>`Costs ${E(e,12e3)} in severance. Work improves. The team learns loyalty has limits.`,apply:e=>(qt(e,Kn(e)),m(e,{cash:-12e3,morale:-5,quality:3}),"You let a loyal early employee go with generous severance.")},{label:"Keep them where they are",hint:()=>"Costs nothing today. The work suffers and stronger colleagues carry the load.",apply:e=>(m(e,{quality:-3,debt:4}),"You kept the struggling early employee in their role.")},{label:"Find them a smaller role",hint:()=>"Kind and usually workable. About one time in three they resent it and quit anyway.",apply:(e,t)=>t.chance(.33)?(qt(e,Kn(e)),m(e,{morale:-3}),"You offered a smaller role. They took it as an insult and quit."):(m(e,{morale:2,quality:1}),"You moved the early employee into a role that fits them.")}]},{id:"crunch",area:"People",minStage:1,when:te,title:()=>"A deadline only overtime can meet",body:e=>"A major opportunity needs delivering in three weeks. It can be done, if the whole team works evenings and weekends until then.",options:[{label:"Ask for the crunch",hint:e=>`You win the business: more ${pe(e).unit} and ${E(e,25e3)}. Morale takes a heavy hit.`,apply:e=>(m(e,{cash:25e3,morale:-10,debt:4}),e.company.customers+=Math.max(1,Math.round(10*js(e).scale)),"The team crunched for three weeks and delivered.")},{label:"Turn the opportunity down",hint:()=>"No extra business. The team sees you will not spend their weekends lightly.",apply:e=>(m(e,{morale:4}),"You turned down the rush job to protect the team.")}]},{id:"blame",area:"People",minStage:1,when:te,title:()=>"An employee made a costly mistake",body:()=>"A junior employee made an error that cost a customer real money. The customer wants to know who was responsible and what you are doing about it.",options:[{label:"Take the blame yourself",hint:e=>`Costs ${E(e,8e3)} to put right and a little reputation. Your team will remember it.`,apply:e=>(m(e,{cash:-8e
